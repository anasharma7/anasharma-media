name: Fetch live signals

on:
  schedule:
    # every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch signals
        run: npm run fetch-signals

      - name: Commit and push if changed
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@github.com"
          if git diff --quiet content/signals-live.json; then
            echo "No changes to signals-live.json, nothing to commit."
          else
            git add content/signals-live.json
            git commit -m "signals: refresh live feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
